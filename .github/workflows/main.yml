name: CI/CD Pipeline Simple

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código del repositorio
    - name: Checkout del código
      uses: actions/checkout@v4

    # 2. Configurar el entorno de Python
    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Instalación de dependencias (Fase de Compilación/Preparación)
    - name: Instalación de dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest

    # 4. Ejecución de pruebas unitarias
    - name: Ejecutar pruebas unitarias
      run: |
        pytest

    # 5. Despliegue simulado
    - name: Simulación de despliegue
      run: |
        echo "Iniciando despliegue en ambiente de Staging..."
        mkdir -p staging_dir
        cp -r *.py staging_dir/
        ls -la ./staging_dir
	echo "Archivos copiados exitosamente a staging_dir/"
        echo "¡Despliegue exitoso!"
